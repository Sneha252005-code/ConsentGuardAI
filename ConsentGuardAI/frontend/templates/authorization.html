{% extends "base.html" %}

{% block title %}Authorization Check | ConsentGuardAI{% endblock %}

{% block content %}
<section class="page-heading">
    <h1>Authorization Check</h1>
    <p>Check whether a data use is covered by active consent.</p>
</section>

<section class="form-card">
    <form id="authorization-form">
        <label for="auth-user-id">User ID</label>
        <input type="text" id="auth-user-id" name="user_id"
               placeholder="Enter user ID" required>

        <label for="auth-purpose">Requested purpose</label>
        <select id="auth-purpose" name="purpose" required>
            <option value="">Select a purpose</option>
            <option value="customer_support">Customer Support</option>
            <option value="personalization">Personalization</option>
            <option value="analytics">Analytics</option>
            <option value="research">Research</option>
        </select>

        <label for="auth-category">Data category</label>
        <select id="auth-category" name="data_category" required>
            <option value="">Select a category</option>
            <option value="profile">Profile</option>
            <option value="email">Email</option>
            <option value="activity">Activity</option>
        </select>

        <button type="submit" class="button">Check Authorization</button>
    </form>

    <div id="authorization-result" role="status" aria-live="polite"></div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/authorization.js') }}"></script>
{% endblock %}
