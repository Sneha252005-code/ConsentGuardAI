{% extends "base.html" %}

{% block title %}Manage Consent | ConsentGuardAI{% endblock %}

{% block content %}
<section class="page-heading">
    <h1>Consent Management</h1>
    <p>Choose the purpose and data categories you agree to share.</p>
</section>

<section class="form-card">
    <form id="consent-form">
        <label for="user_id">User ID</label>
        <input type="text" id="user_id" name="user_id"
               placeholder="Enter your user ID" required>

        <label for="purpose">Purpose</label>
        <select id="purpose" name="purpose" required>
            <option value="">Select a purpose</option>
            <option value="customer_support">Customer Support</option>
            <option value="personalization">Personalization</option>
            <option value="analytics">Analytics</option>
            <option value="research">Research</option>
        </select>

        <fieldset>
            <legend>Data categories</legend>

            <label class="checkbox-label">
                <input type="checkbox" name="data_categories"
                       value="profile">
                Profile
            </label>

            <label class="checkbox-label">
                <input type="checkbox" name="data_categories"
                       value="email">
                Email
            </label>

            <label class="checkbox-label">
                <input type="checkbox" name="data_categories"
                       value="activity">
                Activity
            </label>
        </fieldset>

        <button type="submit" class="button">Grant Consent</button>
        <p id="consent-message" role="status"></p>
    </form>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/consent.js') }}"></script>
{% endblock %}
