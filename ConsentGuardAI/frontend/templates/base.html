<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ConsentGuardAI{% endblock %}</title>

    <!-- Main stylesheets -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/forms.css') }}">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">

    {% block extra_css %}{% endblock %}
</head>

<body>
    <header class="site-header">
        <a class="brand" href="/">ConsentGuardAI</a>

        <nav>
            <a href="/">Home</a>
            <a href="/login">Login</a>
            <a href="/register">Register</a>
            <a href="/consent">Consent</a>
            <a href="/authorization">Authorization</a>
            <a href="/record">Records</a>
            <a href="/audit">Audit</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>ConsentGuardAI — Your data, your consent.</p>
    </footer>

    <!-- Shared API helper -->
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
